services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waloma
      POSTGRES_USER: waloma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waloma_change_me}
    volumes:
      - waloma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waloma -d waloma"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://waloma:${POSTGRES_PASSWORD:-waloma_change_me}@db:5432/waloma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  waloma_postgres_data:
